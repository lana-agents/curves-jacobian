name = "curves-jacobian"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CurvesJacobian"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "CurvesJacobian"

# `IsCurveOver` (smooth proper geometrically integral curves), stalks of curves, `Algebra k K(X)`.
[[require]]
name = "belyi"
git = "https://github.com/lana-agents/belyi"
rev = "65229a52a9e91417ba8353abdf6ec9a6f96dc48b"

# Function fields over perfect fields: places, divisors, Riemann–Roch, genus, Pic (W1–W6).
[[require]]
name = "weil-curves"
git = "https://github.com/lana-agents/weil-curves"
rev = "58b577bd3ab81789e66986e4500e8c2a395e082a"

# Étale fundamental groups; Galois-theoretic π₁ of curves and surjectivity of inertia.
[[require]]
name = "pi1"
git = "https://github.com/lana-agents/pi1"
rev = "77a06d12c78b4fd8d923e3dba7a145942bf85a3a"

# Kummer theory `Kˣ/(Kˣ)ⁿ ≃ H¹_cont(G_K, μₙ)`.
[[require]]
name = "continuous-kummer-theory"
git = "https://github.com/lana-agents/continuous-kummer-theory"
rev = "e3fc64c0b432779995121e138b6f65fc377242c8"

# Two-set Čech complexes (`TwoCech`, `SchemeTwoCech`) for cohomology of curves.
[[require]]
name = "formal-schemes"
git = "https://github.com/lana-agents/formal-schemes"
rev = "0be7863f6cd611bb9b3c8a8078f92bdd78007c80"
