name = "curves-jacobian"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CurvesJacobian"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "CurvesJacobian"

# `IsCurveOver` (smooth proper geometrically integral curves), stalks of curves, `Algebra k K(X)`.
[[require]]
name = "belyi"
git = "https://github.com/lana-agents/belyi"
rev = "e00c309b826590ab71a32e37afb5fbb6ad6e24cf"

# Function fields over perfect fields: places, divisors, Riemann–Roch, genus, Pic (W1–W6).
[[require]]
name = "weil-curves"
git = "https://github.com/lana-agents/weil-curves"
rev = "007793ba8b839f1746d9477e643a075e66a220c6"

# Étale fundamental groups; Galois-theoretic π₁ of curves and surjectivity of inertia.
[[require]]
name = "pi1"
git = "https://github.com/lana-agents/pi1"
rev = "1f01e28501d2a0a5fd6851ac26f25fd0c7783cdd"

# Kummer theory `Kˣ/(Kˣ)ⁿ ≃ H¹_cont(G_K, μₙ)`.
[[require]]
name = "continuous-kummer-theory"
git = "https://github.com/lana-agents/continuous-kummer-theory"
rev = "e3fc64c0b432779995121e138b6f65fc377242c8"

# Two-set Čech complexes (`TwoCech`, `SchemeTwoCech`) for cohomology of curves.
[[require]]
name = "formal-schemes"
git = "https://github.com/lana-agents/formal-schemes"
rev = "e58ecf04554f14c8d1cc2753136f9d785525df5a"

# Slimness of absolute Galois groups of number fields (`NumberField.centralizer_eq_bot_of_isOpen`,
# Mathlib-only module; cj's continuous-kummer-theory pin takes precedence over LCFT's).
[[require]]
name = "local-class-field-theory"
git = "https://github.com/lana-agents/local-class-field-theory"
rev = "a6655a871f92138e486362f08f7df48204f3e985"
